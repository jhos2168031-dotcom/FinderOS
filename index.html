<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Finder OS - macOS Edition</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(255, 255, 255, 0.4);
            --glass-blur: blur(25px);
            --dock-bg: rgba(255, 255, 255, 0.4);
        }

        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: url('https://images.unsplash.com/photo-1518173946687-a4c8892bbd9f?q=80&w=2574&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            user-select: none;
            transition: background-image 0.5s ease;
        }

        /* Brightness Filter */
        #brightness-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0); pointer-events: none; z-index: 9999;
            transition: background 0.3s ease;
        }

        /* macOS Menu Bar */
        .mac-menubar {
            height: 28px;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            width: 100%; position: fixed; top: 0;
            display: flex; align-items: center; padding: 0 16px;
            font-size: 13px; font-weight: 500; color: #1d1d1f;
            z-index: 5000;
            box-shadow: 0 1px 1px rgba(0,0,0,0.1);
        }
        .menu-item {
            padding: 0 10px; cursor: default; height: 100%;
            display: flex; align-items: center; border-radius: 4px;
        }
        .menu-item:hover { background: rgba(0,0,0,0.1); }
        .menu-logo { font-size: 15px; margin-right: 4px; }
        .active-app-name { font-weight: 700; }

        /* Desktop Area */
        .desktop {
            width: 100%; height: calc(100vh - 28px);
            margin-top: 28px; position: relative; overflow: hidden;
        }

        /* macOS Window Styling */
        .mac-window {
            position: absolute;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.25), 0 0 0 1px rgba(255,255,255,0.4) inset;
            display: flex; flex-direction: column;
            border: 0.5px solid rgba(0,0,0,0.15);
            min-width: 300px; min-height: 200px;
            overflow: hidden;
            animation: window-open 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.1) forwards;
        }

        @keyframes window-open {
            from { opacity: 0; transform: scale(0.95) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .mac-window.closing {
            animation: window-close 0.2s ease-in forwards; pointer-events: none;
        }
        @keyframes window-close {
            from { opacity: 1; transform: scale(1); }
            to { opacity: 0; transform: scale(0.95); }
        }
        .mac-window.minimized {
            transform: scale(0) translateY(100vh); opacity: 0; pointer-events: none;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .mac-window.maximized {
            top: 28px !important; left: 0 !important;
            width: 100vw !important; height: calc(100vh - 28px) !important;
            border-radius: 0; transition: all 0.3s ease;
        }

        /* Window Header & Traffic Lights */
        .window-header {
            height: 38px; display: flex; align-items: center; padding: 0 12px;
            cursor: default; background: rgba(255, 255, 255, 0.4);
            border-bottom: 0.5px solid rgba(0,0,0,0.1);
            position: relative; flex-shrink: 0;
        }
        .traffic-lights {
            display: flex; gap: 8px; z-index: 50; position: absolute; left: 12px;
        }
        .traffic-light {
            width: 12px; height: 12px; border-radius: 50%; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            border: 0.5px solid rgba(0,0,0,0.1);
        }
        .light-close { background: #ff5f56; border-color: #e0443e; }
        .light-min { background: #ffbd2e; border-color: #dea123; }
        .light-max { background: #27c93f; border-color: #1aab29; }
        .traffic-lights:hover .traffic-light::after {
            content: ''; display: block; width: 6px; height: 6px; opacity: 0.6;
            background-position: center; background-repeat: no-repeat;
        }
        
        .window-title {
            width: 100%; text-align: center; font-size: 13px; font-weight: 600;
            color: #333; pointer-events: none;
        }

        .window-content {
            flex: 1; overflow: auto; position: relative; background: #fafafa;
        }

        /* Iframe interaction block during drag */
        .dragging .window-content::after {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 9999;
        }

        /* macOS Dock */
        .dock-container {
            position: fixed; bottom: 10px; width: 100%;
            display: flex; justify-content: center; z-index: 4000;
        }
        .mac-dock {
            background: var(--dock-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            padding: 8px 10px; border-radius: 24px;
            display: flex; align-items: flex-end; gap: 10px;
            border: 0.5px solid rgba(255,255,255,0.4);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            height: 64px;
        }
        .dock-item-wrapper {
            position: relative; display: flex; flex-direction: column; align-items: center;
        }
        .dock-item {
            width: 48px; height: 48px; border-radius: 12px;
            background: white; display: flex; align-items: center; justify-content: center;
            font-size: 28px; cursor: pointer;
            transition: all 0.2s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transform-origin: bottom;
        }
        .dock-item:hover { transform: scale(1.3) translateY(-10px); margin: 0 10px; z-index: 10; }
        .dock-indicator {
            width: 4px; height: 4px; background: rgba(0,0,0,0.8);
            border-radius: 50%; margin-top: 4px; opacity: 0; transition: opacity 0.2s;
        }
        .dock-item-wrapper.active .dock-indicator { opacity: 1; }

        /* Context Menu */
        .mac-context-menu {
            position: fixed; background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px); border: 0.5px solid rgba(0,0,0,0.15);
            border-radius: 8px; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            padding: 5px; z-index: 6000; font-size: 13px; min-width: 180px;
            display: none;
        }
        .context-item {
            padding: 4px 12px; border-radius: 4px; cursor: default;
            display: flex; align-items: center; justify-content: space-between;
        }
        .context-item:hover { background: #007aff; color: white; }
        
        /* App Specific Styles */
        .terminal-box { font-family: 'Menlo', 'Monaco', monospace; background: rgba(30,30,30,0.95); color: #4af626; padding: 12px; height: 100%; }
        .terminal-input { background: transparent; border: none; outline: none; color: white; width: 80%; }
        
        .finder-sidebar { width: 180px; background: rgba(240, 240, 240, 0.6); border-right: 1px solid rgba(0,0,0,0.1); padding: 10px; font-size: 12px; }
        .finder-sidebar-item { padding: 6px 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 8px; color: #333; font-weight: 500; margin-bottom: 2px;}
        .finder-sidebar-item:hover { background: rgba(0,0,0,0.05); }
        .finder-sidebar-item.active { background: #dcdcdc; }
        
        /* Modals */
        .mac-alert-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.2); z-index: 9999; display: none;
            align-items: center; justify-content: center;
        }
        .mac-alert {
            background: rgba(255,255,255,0.95); backdrop-filter: blur(20px);
            width: 300px; border-radius: 14px; padding: 20px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); border: 1px solid rgba(0,0,0,0.1);
        }
        
        /* Notifications */
        .mac-notification {
            position: fixed; top: 38px; right: -320px; width: 300px;
            background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(20px);
            border: 1px solid rgba(0,0,0,0.1); border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1); padding: 16px;
            z-index: 10000; transition: right 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex; gap: 12px;
        }
        .mac-notification.show { right: 16px; }
    </style>
</head>
<body oncontextmenu="return false">

    <!-- Brightness mask -->
    <div id="brightness-overlay"></div>

    <!-- Top Menu Bar -->
    <div class="mac-menubar">
        <div class="menu-item menu-logo" onclick="openApp('settings')"><i class="fab fa-apple"></i></div>
        <div class="menu-item active-app-name" id="menu-active-app">Finder</div>
        <div class="menu-item hidden sm:flex">파일</div>
        <div class="menu-item hidden sm:flex">편집</div>
        <div class="menu-item hidden sm:flex">보기</div>
        <div class="menu-item hidden sm:flex">이동</div>
        <div class="menu-item hidden sm:flex">윈도우</div>
        <div class="ml-auto flex items-center gap-4">
            <span id="cloud-status" class="text-[11px] font-medium text-gray-500 flex items-center gap-1.5" title="Firebase Status">
                <i class="fas fa-cloud text-gray-400"></i> Offline
            </span>
            <i class="fas fa-wifi"></i>
            <i class="fas fa-battery-three-quarters"></i>
            <i class="fas fa-search cursor-pointer" onclick="openApp('finder')"></i>
            <span id="sys-clock" class="font-medium text-sm"></span>
        </div>
    </div>

    <!-- Desktop Workspace -->
    <div class="desktop" id="desktop"></div>

    <!-- macOS Dock -->
    <div class="dock-container">
        <div class="mac-dock" id="dock-bar">
            <!-- Dock items will be generated by JSON Config -->
        </div>
    </div>

    <!-- Context Menu -->
    <div id="sys-context-menu" class="mac-context-menu">
        <div class="context-item" id="ctx-open"><span>열기</span> <span class="text-gray-400 text-[10px]">⌘O</span></div>
        <div class="context-item text-red-500 border-t mt-1 pt-1" id="ctx-delete"><span>휴지통으로 이동</span> <span class="text-gray-400 text-[10px]">⌘⌫</span></div>
    </div>

    <!-- System Alert Modal -->
    <div id="sys-alert-overlay" class="mac-alert-overlay">
        <div class="mac-alert">
            <div class="text-3xl text-blue-500 mb-2"><i class="fas fa-info-circle"></i></div>
            <h4 class="font-bold text-sm text-gray-800 mb-2" id="alert-title">알림</h4>
            <p class="text-xs text-gray-600 mb-5 leading-relaxed" id="alert-msg"></p>
            <button onclick="closeAlert()" class="w-full py-1.5 bg-blue-500 hover:bg-blue-600 text-white rounded-lg text-sm font-semibold">확인</button>
        </div>
    </div>

    <!-- Notification Banner -->
    <div id="sys-notification" class="mac-notification">
        <div class="flex-1">
            <div class="text-xs font-bold text-gray-800">Finder OS</div>
            <p class="text-[12px] text-gray-600 mt-1" id="noti-msg"></p>
        </div>
    </div>

    <!-- Save Dialog -->
    <div id="save-dialog-overlay" class="mac-alert-overlay">
        <div class="mac-alert" style="width:360px;">
            <h4 class="font-bold text-sm text-gray-800 mb-4 text-left">파일 저장</h4>
            <div class="text-left mb-4">
                <label class="block text-xs text-gray-500 mb-1">파일 이름:</label>
                <input type="text" id="save-filename" class="w-full border rounded p-1.5 text-sm outline-blue-500" placeholder="문서.txt">
                <p class="text-[10px] text-gray-400 mt-1">*.enc 입력시 자동 암호화 저장됨.</p>
            </div>
            <div class="flex justify-end gap-2">
                <button onclick="closeSaveDialog()" class="px-4 py-1.5 border rounded-lg text-xs hover:bg-gray-50">취소</button>
                <button onclick="confirmSaveFile()" class="px-4 py-1.5 bg-blue-500 text-white rounded-lg text-xs font-semibold">저장</button>
            </div>
        </div>
    </div>

                "crypto": {

                    template: () => `

                    `
                },
                "developer": {
                    id: "developer", name: "Game Creator", icon: "fa-code text-indigo-500", width: 800, height: 500,

                                <div class="p-3 bg-[#2d2d2d] flex gap-2">
                                    <input type="text" id="dev-title" placeholder="앱 이름" class="flex-1 bg-gray-800 px-2 py-1 text-xs rounded border border-gray-600 outline-none">
                                    <button onclick="devSys.deploy(this)" class="bg-blue-600 hover:bg-blue-500 px-3 py-1 rounded text-xs whitespace-nowrap">스토어 배포</button>
                                </div>
                            </div>
                            <div class="w-1/2 bg-white relative">
                                <iframe id="dev-preview" class="w-full h-full border-none"></iframe>
                            </div>
                        </div>
                    `
                }
            },
            // Initial Dock layout
            dock: ["finder", "store", "chrome", "notepad", "developer", "crypto", "terminal", "settings"],
            installedApps: ["finder", "store", "chrome", "notepad", "developer", "crypto", "terminal", "settings"] // All default apps
        };

        // Runtime State
        const state = {
            openWindows: {}, // { appId: DOMElement }
            zIndex: 100,
            activeApp: 'Finder',
            tempFileContent: '',
            deployedApps: [] // Fetched from Firebase
        };
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'finder-os-id';
        let db, auth;

        async function initFirebase() {
            try {
                if (typeof __firebase_config === 'undefined') throw new Error("No config");
                const config = JSON.parse(__firebase_config);
                const app = initializeApp(config);
                auth = getAuth(app);
                db = getFirestore(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        document.getElementById('cloud-status').innerHTML = `<i class="fas fa-cloud text-green-500"></i> Online`;
                        syncData();
                    }
                });
            } catch (e) {
                console.log("Offline mode active", e);
                window.renderStore(); // Render default store
            }
        }

        function syncData() {
            // RULE 1: Strict Paths
            const appsRef = collection(db, 'artifacts', appId, 'public', 'data', 'deployedApps');
            onSnapshot(appsRef, (snap) => {
                const apps = [];
                snap.forEach(doc => apps.push(doc.data()));
                state.deployedApps = apps;
                window.renderStore();
            }, (err) => console.error(err));

            const filesRef = collection(db, 'artifacts', appId, 'public', 'data', 'downloadedFiles');
            onSnapshot(filesRef, (snap) => {
                const files = [];
                snap.forEach(doc => files.push(doc.data()));
                osConfig.fileSystem.downloads = files;
                if(state.openWindows['finder']) window.finderSys.refresh();
            }, (err) => console.error(err));
        }

        window.firebaseDeployApp = async (appData) => {
            if(!db || !auth.currentUser) return false;
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'deployedApps', appData.id), appData);
                return true;
            } catch(e) { console.error(e); return false; }
        };

        window.firebaseSaveFile = async (fileData) => {
            if(!db || !auth.currentUser) return false;
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'downloadedFiles', fileData.id), fileData);
                return true;
            } catch(e) { console.error(e); return false; }
        };

        window.firebaseDeleteFile = async (fileId) => {
            if(!db || !auth.currentUser) return false;
            try {
                await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'downloadedFiles', fileId));
            } catch(e) {}
        };

        initFirebase();
    </script>

    <script>
        // Utilities
        function notify(msg) {
            const el = document.getElementById('sys-notification');
            document.getElementById('noti-msg').innerText = msg;
            el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 3500);
        }
        function alertMsg(title, msg) {
            document.getElementById('alert-title').innerText = title;
            document.getElementById('alert-msg').innerText = msg;
            document.getElementById('sys-alert-overlay').style.display = 'flex';
        }
        function closeAlert() { document.getElementById('sys-alert-overlay').style.display = 'none'; }
        
        // Window Manager
        const wm = {
            create: (appId) => {
                let app = osConfig.apps[appId];
                
                // Check if it's a deployed game (dynamically added)
                if(!app) {
                    const deployed = state.deployedApps.find(a => a.id === appId);
                    if(deployed) {
                        app = {
                            id: deployed.id, name: deployed.name, icon: "fa-gamepad text-indigo-500",
                            width: 600, height: 450,
                            template: () => `<div class="w-full h-full bg-black"><iframe srcdoc="${deployed.code.replace(/"/g, '&quot;')}" class="w-full h-full border-none bg-white"></iframe></div>`
                        };
                    }
                }
                
                if (!app) return;
                
                if (state.openWindows[appId]) {
                    wm.focus(appId);
                    const win = state.openWindows[appId];
                    if (win.classList.contains('minimized')) win.classList.remove('minimized');
                    return;
                }

                const win = document.createElement('div');
                win.className = 'mac-window';
                win.style.width = `${app.width}px`;
                win.style.height = `${app.height}px`;
                win.style.left = `${Math.max(20, (window.innerWidth - app.width) / 2 + (Object.keys(state.openWindows).length * 20))}px`;
                win.style.top = `${Math.max(40, (window.innerHeight - app.height) / 2 + (Object.keys(state.openWindows).length * 20))}px`;
                win.id = `win-${appId}`;

                win.innerHTML = `
                    <div class="window-header">
                        <div class="traffic-lights">
                            <div class="traffic-light light-close" onclick="wm.close('${appId}')"></div>
                            <div class="traffic-light light-min" onclick="wm.minimize('${appId}')"></div>
                            <div class="traffic-light light-max" onclick="wm.maximize('${appId}')"></div>
                        </div>
                        <div class="window-title">${app.name}</div>
                    </div>
                    <div class="window-content">${app.template()}</div>
                `;

                // Dragging Logic
                const header = win.querySelector('.window-header');
                header.addEventListener('mousedown', (e) => wm.startDrag(e, win));
                win.addEventListener('mousedown', () => wm.focus(appId));

                document.getElementById('desktop').appendChild(win);
                state.openWindows[appId] = win;
                wm.focus(appId);
                osSys.updateDockIndicators();

                // Post-render triggers
                if (appId === 'finder') finderSys.refresh();
                if (appId === 'store') window.renderStore();
            },
            close: (appId) => {
                const win = state.openWindows[appId];
                if (!win) return;
                win.classList.add('closing');
                setTimeout(() => {
                    win.remove();
                    delete state.openWindows[appId];
                    osSys.updateDockIndicators();
                    if(Object.keys(state.openWindows).length === 0) {
                        document.getElementById('menu-active-app').innerText = "Finder";
                    }
                }, 200);
            },
            minimize: (appId) => {
                const win = state.openWindows[appId];
                if (win) win.classList.add('minimized');
            },
            maximize: (appId) => {
                const win = state.openWindows[appId];
                if (win) win.classList.toggle('maximized');
            },
            focus: (appId) => {
                const win = state.openWindows[appId];
                if (win) {
                    state.zIndex++;
                    win.style.zIndex = state.zIndex;
                    const title = win.querySelector('.window-title').innerText;
                    document.getElementById('menu-active-app').innerText = title;
                }
            },
            startDrag: (e, win) => {
                if (win.classList.contains('maximized')) return;
                wm.focus(win.id.replace('win-', ''));
                win.classList.add('dragging');
                let startX = e.clientX - win.offsetLeft;
                let startY = e.clientY - win.offsetTop;

                function onMove(e) {
                    win.style.left = `${e.clientX - startX}px`;
                    win.style.top = `${Math.max(28, e.clientY - startY)}px`;
                }
                function onUp() {
                    win.classList.remove('dragging');
                    window.removeEventListener('mousemove', onMove);
                    window.removeEventListener('mouseup', onUp);
                }
                window.addEventListener('mousemove', onMove);
                window.addEventListener('mouseup', onUp);
            }
        };

        window.openApp = wm.create;

        // Core OS Functions
        const osSys = {
            init: () => {
                osSys.renderDock();
                setInterval(() => {
                    const now = new Date();
                    document.getElementById('sys-clock').innerText = now.toLocaleTimeString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: true });
                }, 1000);
                setTimeout(() => wm.create('finder'), 500);
                
                // Global context menu hide
                window.addEventListener('click', () => document.getElementById('sys-context-menu').style.display = 'none');
            },
            renderDock: () => {
                const dock = document.getElementById('dock-bar');
                dock.innerHTML = '';
                osConfig.dock.forEach(appId => {
                    const app = osConfig.apps[appId];
                    if(!app) return;
                    dock.innerHTML += `
                        <div class="dock-item-wrapper" id="dock-wrap-${appId}">
                            <div class="dock-item" onclick="openApp('${appId}')" title="${app.name}">
                                <i class="fas ${app.icon}"></i>
                            </div>
                            <div class="dock-indicator"></div>
                        </div>
                    `;
                });
                osSys.updateDockIndicators();
            },
            updateDockIndicators: () => {
                document.querySelectorAll('.dock-item-wrapper').forEach(el => el.classList.remove('active'));
                Object.keys(state.openWindows).forEach(appId => {
                    const wrap = document.getElementById(`dock-wrap-${appId}`);
                    if(wrap) wrap.classList.add('active');
                });
            },
            setWallpaper: (url) => { document.body.style.backgroundImage = `url('${url}')`; },
            setBrightness: (val) => { document.getElementById('brightness-overlay').style.backgroundColor = `rgba(0,0,0,${val/100})`; }
        };

        
        // 1. Finder System
        const finderSys = {
            currentTab: 'desktop',
            switchTab: (tab) => {
                finderSys.currentTab = tab;
                const win = state.openWindows['finder'];
                if(win) {
                    win.querySelectorAll('.finder-sidebar-item').forEach(el => {
                        el.classList.remove('active');
                        if(el.dataset.tab === tab) el.classList.add('active');
                    });
                }
                finderSys.refresh();
            },
            refresh: () => {
                const win = state.openWindows['finder'];
                if(!win) return;
                const grid = win.querySelector('#finder-grid');
                if(!grid) return;
                grid.innerHTML = '';

                let items = [];
                if(finderSys.currentTab === 'desktop') items = osConfig.fileSystem.desktop;
                else if(finderSys.currentTab === 'downloads') items = osConfig.fileSystem.downloads;
                else if(finderSys.currentTab === 'apps') {
                    osConfig.installedApps.forEach(id => {
                        if(osConfig.apps[id]) items.push({ id: id, name: osConfig.apps[id].name, icon: osConfig.apps[id].icon, type: 'app' });
                    });
                    state.deployedApps.forEach(app => {
                        if(osConfig.installedApps.includes(app.id)) items.push({ id: app.id, name: app.name, icon: "fa-gamepad text-indigo-500", type: 'app' });
                    });
                }

                items.forEach(item => {
                    let isEnc = item.name && item.name.endsWith('.enc');
                    let displayIcon = item.icon || "fa-file text-gray-400";
                    if(isEnc) displayIcon = "fa-file-shield text-emerald-500";
                    
                    grid.innerHTML += `
                        <div class="flex flex-col items-center gap-1 cursor-pointer p-2 rounded hover:bg-gray-100 transition-colors"
                             onclick="finderSys.openItem('${item.id}', '${item.type}', '${item.name}')"
                             oncontextmenu="finderSys.contextMenu(event, '${item.id}', '${item.type}')">
                            <i class="fas ${displayIcon} text-4xl mb-1 drop-shadow-sm"></i>
                            <span class="text-[11px] text-center w-full truncate text-gray-800 font-medium">${item.name}</span>
                        </div>
                    `;
                });
            },
            openItem: (id, type, name) => {
                if(type === 'app') wm.create(id);
                else if (type === 'file') {
                    if(name.endsWith('.enc')) {
                        alertMsg("암호화된 파일", "이 파일은 보안 처리되었습니다. 파일 복호화 도구를 사용하세요.");
                    } else {
                        const file = osConfig.fileSystem.downloads.find(f => f.id === id);
                        if(file) {
                            // simple file viewer
                            wm.create('notepad');
                            setTimeout(()=>{
                                const win = state.openWindows['notepad'];
                                if(win) win.querySelector('textarea').value = file.content;
                            }, 100);
                        }
                    }
                }
            },
            contextMenu: (e, id, type) => {
                if(type === 'app') return; // no delete for apps in this demo
                e.preventDefault();
                e.stopPropagation();
                const menu = document.getElementById('sys-context-menu');
                menu.style.display = 'block';
                menu.style.left = `${e.clientX}px`;
                menu.style.top = `${e.clientY}px`;
                
                document.getElementById('ctx-delete').onclick = () => {
                    if(finderSys.currentTab === 'downloads') {
                        osConfig.fileSystem.downloads = osConfig.fileSystem.downloads.filter(f => f.id !== id);
                        if(window.firebaseDeleteFile) window.firebaseDeleteFile(id);
                    }
                    finderSys.refresh();
                    menu.style.display = 'none';
                };
            }
        };
        window.finderSys = finderSys;

        // 2. Terminal System
        const terminalSys = {
            run: (e, input) => {
                if(e.key !== 'Enter') return;
                const cmd = input.value.trim().toLowerCase();
                if(!cmd) return;
                input.value = '';
                
                const win = input.closest('.terminal-box');
                const history = win.querySelector('#terminal-history');
                history.innerHTML += `<div><span class="font-bold text-white">guest@MacBook-Pro ~ %</span> ${cmd}</div>`;
                
                let out = '';
                if(cmd === 'help') out = "Commands: help, clear, ls, neofetch";
                else if (cmd === 'clear') { history.innerHTML = ''; return; }
                else if (cmd === 'ls') out = osConfig.fileSystem.downloads.map(f=>f.name).join('  ') || '(empty)';
                else if (cmd === 'neofetch') out = `<pre class="text-xs text-blue-400">
                    /\\
                   /  \\      Finder OS (macOS build)
                  /____\\     Kernel: Darwin-Web 20.0
                 /      \\    Shell: zsh-mock
                </pre>`;
                else out = `zsh: command not found: ${cmd}`;
                
                history.innerHTML += `<div class="mb-2 text-gray-300">${out}</div>`;
                win.scrollTop = win.scrollHeight;
            }
        };
        window.terminalSys = terminalSys;

        // 3. App Store System
        window.renderStore = () => {
            const win = state.openWindows['store'];
            if(!win) return;
            const grid = win.querySelector('#store-grid');
            if(!grid) return;
            grid.innerHTML = '';

            // User deployed apps from Firebase
            state.deployedApps.forEach(app => {
                const isInstalled = osConfig.installedApps.includes(app.id);
                grid.innerHTML += `
                    <div class="bg-white border p-4 rounded-xl shadow-sm flex flex-col items-center text-center">
                        <div class="w-14 h-14 bg-indigo-100 text-indigo-500 rounded-2xl flex items-center justify-center text-2xl mb-3 shadow-sm">
                            <i class="fas fa-gamepad"></i>
                        </div>
                        <h4 class="font-bold text-sm mb-1 truncate w-full">${app.name}</h4>
                        <p class="text-[10px] text-gray-400 mb-3 bg-gray-100 px-2 py-0.5 rounded-full">유저 제작</p>
                        <button onclick="installApp('${app.id}', this)" class="w-full py-1.5 rounded-full text-xs font-bold ${isInstalled ? 'bg-gray-100 text-gray-500' : 'bg-blue-500 text-white hover:bg-blue-600'}">
                            ${isInstalled ? '열기' : '설치'}
                        </button>
                    </div>
                `;
            });
            
            if(state.deployedApps.length === 0) {
                grid.innerHTML = `<div class="col-span-3 text-center text-gray-400 text-sm py-10">클라우드에 등록된 앱이 없습니다. Game Creator로 배포해보세요.</div>`;
            }
        };

        window.installApp = (appId, btn) => {
            if(osConfig.installedApps.includes(appId)) {
                wm.create(appId);
                return;
            }
            btn.innerText = "설치중...";
            setTimeout(() => {
                osConfig.installedApps.push(appId);
                if(!osConfig.dock.includes(appId)) {
                    osConfig.dock.push(appId);
                    osSys.renderDock();
                }
                notify(`앱이 설치되었습니다.`);
                window.renderStore();
                if(state.openWindows['finder']) finderSys.refresh();
            }, 800);
        };

        // 4. Game Creator (Dev) System
        const devSys = {
            testCode: (btn) => {
                const win = btn.closest('.h-full');
                const code = win.querySelector('#dev-code').value;
                const iframe = win.querySelector('#dev-preview');
                iframe.srcdoc = code;
            },
            deploy: async (btn) => {
                const win = btn.closest('.h-full');
                const title = win.querySelector('#dev-title').value.trim();
                const code = win.querySelector('#dev-code').value;
                
                if(!title || !code) { alertMsg("오류", "이름과 코드를 입력하세요."); return; }
                
                btn.disabled = true;
                btn.innerText = "배포중...";
                
                const appId = "game_" + Date.now();
                const payload = { id: appId, name: title, code: code };
                
                let success = false;
                if (window.firebaseDeployApp) {
                    success = await window.firebaseDeployApp(payload);
                } else {
                    // Fallback local mock
                    state.deployedApps.push(payload);
                    success = true;
                }
                
                btn.disabled = false;
                btn.innerText = "스토어 배포";
                
                if(success) {
                    alertMsg("성공", "App Store에 실시간 배포되었습니다!");
                    win.querySelector('#dev-title').value = '';
                }
            }
        };
        window.devSys = devSys;

        // 5. Notepad & Save System
        const notepadSys = {
            requestSave: (btn) => {
                const content = btn.closest('.h-full').querySelector('textarea').value;
                state.tempFileContent = content;
                document.getElementById('save-dialog-overlay').style.display = 'flex';
                document.getElementById('save-filename').focus();
            }
        };
        window.notepadSys = notepadSys;

        window.closeSaveDialog = () => {
            document.getElementById('save-dialog-overlay').style.display = 'none';
            document.getElementById('save-filename').value = '';
        };

        // Basic mock encryption
        const mockEncrypt = (str) => btoa(unescape(encodeURIComponent(str)));

        window.confirmSaveFile = async () => {
            const input = document.getElementById('save-filename');
            let name = input.value.trim();
            if(!name) name = "제목없음.txt";
            
            const isEnc = name.endsWith('.enc');
            let content = state.tempFileContent;
            
            if(isEnc) content = mockEncrypt(content);

            const fileData = {
                id: 'file_' + Date.now(),
                name: name,
                content: content,
                type: 'file',
                timestamp: Date.now()
            };

            // Local fallback
            osConfig.fileSystem.downloads.push(fileData);
            
            if(window.firebaseSaveFile) {
                await window.firebaseSaveFile(fileData);
            }

            closeSaveDialog();
            notify(`"${name}" 파일이 다운로드 폴더에 저장되었습니다.`);
            
            if(state.openWindows['finder']) {
                finderSys.switchTab('downloads');
            } else {
                wm.create('finder');
                setTimeout(() => finderSys.switchTab('downloads'), 200);
            }
        };

        // 6. Chrome Simulator
        const chromeSys = {
            go: (el, url) => {
                const win = el.closest('.h-full');
                const input = win.querySelector('input');
                input.value = url;
                chromeSys.processUrl(win, url);
            },
            nav: (e, input) => {
                if(e.key === 'Enter') {
                    let url = input.value.trim();
                    if(!url) return;
                    chromeSys.processUrl(input.closest('.h-full'), url);
                }
            },
            processUrl: async (win, url) => {
                win.querySelector('#chrome-home').classList.add('hidden');
                const iframe = win.querySelector('#chrome-frame');
                iframe.classList.remove('hidden');

                // finder://myip 스킴 특별 처리 로직
                if (url === 'finder://myip') {
                    iframe.src = 'about:blank'; // 렌더링 초기화
                    try {
                        const response = await fetch('https://api.ipify.org?format=json');
                        const data = await response.json();
                        const ip = data.ip;
                        
                        // Blob을 위한 HTML 문서 템플릿
                        const html = `
                            <!DOCTYPE html>
                            <html>
                            <head>
                                <meta charset="utf-8">
                                <script src="https://cdn.tailwindcss.com"><\/script>
                                <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
                            </head>
                            <body class="bg-gray-100 h-screen flex flex-col items-center justify-center p-4 m-0 font-sans">
                                <div class="bg-white p-8 rounded-3xl shadow-xl max-w-md w-full text-center border border-gray-100">
                                    <div class="w-20 h-20 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center mx-auto mb-5 text-3xl shadow-inner">
                                        <i class="fas fa-globe-asia"></i>
                                    </div>
                                    <h2 class="text-2xl font-extrabold text-gray-800 mb-2">My IP Address</h2>
                                    <p class="text-gray-500 mb-6 text-sm">현재 사용 중인 네트워크의 공인 IP 주소입니다.</p>
                                    <div class="bg-slate-50 border-2 border-slate-100 rounded-2xl p-5 mb-6">
                                        <p class="text-4xl font-mono font-bold text-blue-600 tracking-wider">${ip}</p>
                                    </div>
                                    <div class="flex items-center justify-center gap-2 text-sm text-emerald-600 font-bold bg-emerald-50 py-2 rounded-lg">
                                        <i class="fas fa-shield-check"></i> <span>네트워크 연결이 정상적입니다</span>
                                    </div>
                                </div>
                            </body>
                            </html>
                        `;
                        const blob = new Blob([html], { type: 'text/html' });
                        iframe.src = URL.createObjectURL(blob);
                    } catch (error) {
                        const errorHtml = `
                            <div style="display:flex; height:100vh; align-items:center; justify-center; text-align:center; font-family:sans-serif; background:#fef2f2; color:#ef4444; margin:0;">
                                <div style="width:100%;"><h3><i class="fas fa-exclamation-triangle"></i> 네트워크 에러</h3><p>IP 주소를 불러오지 못했습니다. 네트워크 연결을 확인하세요.</p></div>
                            </div>`;
                        iframe.src = URL.createObjectURL(new Blob([errorHtml], { type: 'text/html' }));
                    }
                    return;
                }

                // 일반 URL 처리
                if(!url.startsWith('http') && !url.startsWith('finder://')) {
                    if(url.includes('.')) url = 'https://' + url;
                    else url = 'https://www.google.com/search?q=' + encodeURIComponent(url) + '&igu=1';
                }
                iframe.src = url;
            }
        };
        window.chromeSys = chromeSys;

        // Boot OS
        window.onload = osSys.init;

    </script>
</body>
</html>
